services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/teammapper:cached
    environment:
      MODE: DEV
      # Bind the Angular dev server dual-stack (IPv6 + IPv4). The Codespaces port
      # forwarder reaches the app over IPv6 loopback (::1); an IPv4-only "0.0.0.0"
      # bind refuses that connection and the forwarded URL returns 502. "::" matches
      # the backend, which already listens dual-stack via Node's default.
      BINDING: "::"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: teammapper-user
      POSTGRES_PASSWORD: teammapper-password
      POSTGRES_DATABASE: teammapper-backend-dev
      POSTGRES_SSL: "false"
      POSTGRES_QUERY_TIMEOUT: "100000"
      POSTGRES_STATEMENT_TIMEOUT: "100000"

      POSTGRES_TEST_HOST: postgres
      POSTGRES_TEST_PORT: "5432"
      POSTGRES_TEST_USER: teammapper-user
      POSTGRES_TEST_PASSWORD: teammapper-password
      POSTGRES_TEST_DATABASE: teammapper-backend-test
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: teammapper-backend-dev
      POSTGRES_USER: teammapper-user
      POSTGRES_PASSWORD: teammapper-password
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
      - ./init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teammapper-user -d teammapper-backend-dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
